<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandbox</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" href="texture/favicon.svg" type="image/svg+xml"/>
</head>
<body>
  <div id="menu">
    <div id="main">
      <div id="play">
        <button type="button" name="button" id="connect">Enter game</button>
        <div id="name">
          <input type="text" id="nick" value="Sandbox" placeholder="Username" aria-label="Username">
        </div>
        <select id='hero' class="visually-hidden"></select>
        <button type="button" id="hero-preview">
          <span class="hero-preview-avatar" id="hero-preview-avatar"></span>
          <span class="hero-preview-text">
            <span class="hero-preview-label">Hero</span>
            <span class="hero-preview-name" id="hero-preview-name">Normal</span>
          </span>
          <span class="hero-preview-chevron">&#9662;</span>
        </button>
      </div>
    </div>
    <div id="panel">
      <div class="panel-item" id="interact">
        <span class="panel-label">Load Map</span>
        <label for="load" class="file-upload-label">
          <input type="file" id="load" accept="application/x-yaml, .json, .yaml, .txt" name="file" class="visually-hidden">
          <span class="file-upload-button">Choose file&hellip;</span>
          <span class="file-upload-name" id="load-filename">No file chosen</span>
        </label>
      </div>
      <div class="panel-item">
        <span class="panel-label">World</span>
        <select id='world' class="select-control">
        <option>Original</option>
        <option>Hard</option>
        <option>Bruh</option>
        <option>Custom</option>
        </select>
      </div>
      <div class="panel-item">
        <span class="panel-label">Difficulty</span>
        <select id='diff' class="select-control">
        <option>Easy</option>
        <option>Medium</option>
        <option>Hard</option>
        </select>
      </div>
      <div class="panel-item">
        <span class="panel-label">Wreath</span>
        <select id='wreath' class="select-control">
        <option>Gold</option>
        <option>Spring</option>
        <option>Autumn</option>
        <option>Winter</option>
        <option>Summer</option>
        <option>Rose</option>
        <option>Stars</option>
        <option>Flames</option>
        <option>Halo</option>
        <option>Doughnut</option>
        <option>Pirate Hat</option>
        <option>Fruit Hat</option>
        <option>Flower Hat</option>
        <option>Legacy Hat</option>
        <option>Sunglasses</option>
        <option>Santa Hat</option>
        <option>Blue Santa Hat</option>
        <option>Blue Flames</option>
        <option>Orbit Ring</option>
        <option>Sticky Coat</option>
        <option>Toxic Coat</option>
        <option>Gold Crown</option>
        <option>Silver Crown</option>
        <option>Bronze Crown</option>
        <option>Champion Jewels</option>
        <option>Gold Jewels</option>
        <option>Silver Jewels</option>
        <option>Bronze Jewels</option>
        <option>Winter Olympics</option>
        <option>Summer Olympics</option>
        <option>Summer Olympics 2</option>
        <option>None</option>
        </select>
      </div>
    </div>
    <div id="settings">
      <h2>Settings</h2>
      <div class="tabs">
        <input type="radio" name="settingsTab" id="tab-visuals" checked>
        <input type="radio" name="settingsTab" id="tab-gameplay">
        <input type="radio" name="settingsTab" id="tab-advanced">
        <input type="radio" name="settingsTab" id="tab-controls">
        <div class="tab-bar">
          <label for="tab-visuals">Visuals</label>
          <label for="tab-gameplay">Gameplay</label>
          <label for="tab-advanced">Advanced</label>
          <label for="tab-controls">Controls</label>
        </div>

        <div class="tab-panel settingsElement" id="panel-visuals">
          <div class="setting-row">
            <input type="checkbox" id="projectile_outline" checked>
            <label for="projectile_outline">Projectile outline</label>
          </div>
          <div class="setting-row">
            <input type="checkbox" id="pellets" checked>
            <label for="pellets">Pellets</label>
          </div>
          <div class="setting-row">
            <input type="checkbox" id="fading_effects" checked>
            <label for="fading_effects">Fading Effects</label>
          </div>
          <div class="setting-row">
            <input type="checkbox" id="effect_blending" checked>
            <label for="effect_blending">Effect Blending</label>
          </div>
          <div class="setting-row">
            <input type="checkbox" id="timer" checked>
            <label for="timer">Timer</label>
          </div>
          <div class="setting-row">
            <input type="checkbox" id="enemies_minimap">
            <label for="enemies_minimap">Enemies On Minimap</label>
          </div>
          <div class="setting-row">
            <label for="tiles">Tiles:</label>
            <select id="tiles">
              <option value="tiles" selected>Tiles</option>
              <option value="tiles_empty">No Tiles</option>
              <option value="tiles_dark">Tiles Dark</option>
              <option value="tiles_dark_empty">No Tiles Dark</option>
            </select>
          </div>
          <div class="setting-row">
            <label for="outline">Enemy Outlines:</label>
            <select id="outline">
              <option value="disabled">Disabled</option>
              <option value="enabled" selected>Enabled</option>
              <option value="smart">Smart</option>
              <option value="always_dark">Always Dark</option>
              <option value="always_light">Always Light</option>
            </select>
          </div>
          <div class="setting-row">
            <label for="minimap_scale">Minimap Scaling:</label>
            <input type="range" id="minimap_scale" min="0.00" max="1" step="0.05" value="0.5">
            <span class="setting-value" id="minimap_scale_value">0.50</span>
          </div>
          <div class="setting-row">
            <label for="ui_scale">UI Scale:</label>
            <input type="range" id="ui_scale" min="0.40" max="1" step="0.05" value="1">
            <span class="setting-value" id="ui_scale_value">1.00</span>
          </div>
        </div>

        <div class="tab-panel settingsElement" id="panel-gameplay">
          <div class="setting-row">
            <input type="checkbox" id="mouse_toggle" checked>
            <label for="mouse_toggle">Mouse Toggle Movement</label>
          </div>
          <div class="setting-row">
            <input type="checkbox" id="no_points">
            <label for="no_points">No Points</label>
          </div>
          <div class="setting-row">
            <input type="checkbox" id="max_abilities">
            <label for="max_abilities">Max Abilities</label>
          </div>
          <div class="setting-row">
            <input type="checkbox" id="max_stats">
            <label for="max_stats">Max Stats</label>
          </div>
          <div class="setting-row">
            <input type="checkbox" id="slow_upgrade">
            <label for="slow_upgrade">Evades Upgrade System</label>
          </div>
          <div class="setting-row">
            <input type="checkbox" id="convert_to_legacy_speed">
            <label for="convert_to_legacy_speed">Convert To Legacy Speed</label>
          </div>
          <div class="setting-row">
            <input type="checkbox" id="death_cooldown">
            <label for="death_cooldown">After Death Cooldown</label>
          </div>
        </div>

        <div class="tab-panel settingsElement" id="panel-advanced">
          <div class="setting-row">
            <input type="checkbox" id="tournament_mode">
            <label for="tournament_mode">Tournament Mode</label>
          </div>
          <div class="setting-row">
            <input type="checkbox" id="speedrun_mode">
            <label for="speedrun_mode">Speedrun Mode</label>
          </div>
          <div class="settings-divider"></div>
          <div class="setting-row">
            <input type="checkbox" id="dev">
            <label for="dev">Advanced Mode</label>
          </div>
          <div class="setting-row">
            <input type="checkbox" id="cheats">
            <label for="cheats">Cheats</label>
          </div>
          <div class="setting-row">
            <input type="checkbox" id="v_sync">
            <label for="v_sync">V-Sync</label>
          </div>
          <div class="setting-row">
            <input type="checkbox" id="seeded_area_resets">
            <label for="seeded_area_resets">Seeded Area Resets</label>
          </div>
          <div class="setting-row">
            <label for="seed">Seed:</label>
            <input type="number" id="seed" placeholder="Empty = random" min="0">
          </div>
          <div class="setting-row">
            <label for="fps_limit">FPS Limit:</label>
            <select id="fps_limit">
              <option value="unlimited">Unlimited FPS</option>
              <option value="60" selected>60 FPS</option>
              <option value="30">30 FPS</option>
            </select>
          </div>
          <div class="setting-row">
            <label for="input_delay">Input Delay:</label>
            <input type="number" id="input_delay" placeholder="Default is 0ms" value="0" min="0">
          </div>
          <div class="setting-row">
            <label for="tick_delay">Tick Delay:</label>
            <input type="number" id="tick_delay" placeholder="1 tick is 33ms" value="0" min="0">
          </div>
        </div>

        <div class="tab-panel settingsElement" id="panel-controls"></div>
      </div>
    </div>
    <div id="hotkeys">
      <h3>Hotkeys</h3>
      <ul id="hotkeys-main"></ul>
      <h4>Cheats:</h4>
      <ul id="hotkeys-cheats"></ul>
      <h4>Advanced Mode:</h4>
      <ul id="hotkeys-advanced"></ul>
    </div>
  </div>
  <div class="hero-modal-overlay" id="hero-modal" hidden>
    <div class="hero-modal" role="dialog" aria-modal="true" aria-labelledby="hero-modal-title">
      <div class="hero-modal-header">
        <h2 id="hero-modal-title">Choose your Hero</h2>
        <button type="button" class="hero-modal-close" id="hero-modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="hero-grid" id="hero-grid"></div>
      <div class="hero-tooltip" id="hero-tooltip" role="tooltip" hidden></div>
    </div>
  </div>
  <script src="listeners.js"></script>
  <div id="gamed" style="display:none;">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>
  <script src="evades_yaml.js"></script>
  <script src="maps.js"></script>
  <script src="vector.js"></script>
  <script src="utils.js"></script>
  <script src="entities.js"></script>
  <script src="game.js"></script>
  <script src="drawer.js"></script>
  <script src="main.js"></script>
</body>
</html>
